name: Autograde

on:
  push:
    branches: ["main"]
    tags: ["submit/*"]

jobs:
  grade:
    uses: "UM6P-CC/classroom50/.github/workflows/autograde-runner.yaml@main"
    secrets: inherit
    permissions:
      contents: write
      statuses: write
      # Lets the runner open the opt-in Feedback PR. A reusable
      # workflow's token is the intersection with the caller's grants, so
      # this must mirror autograde-runner.yaml's permissions.
      pull-requests: write
